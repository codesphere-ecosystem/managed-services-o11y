apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: ${CLICKHOUSE_HOST}
      port: 9000
      protocol: native
      username: ${CLICKHOUSE_USER}
      defaultDatabase: ${CLICKHOUSE_DATABASE}
      logs:
        defaultDatabase: ${CLICKHOUSE_DATABASE}
        defaultTable: otel_logs
        otelEnabled: true
        otelVersion: latest
      traces:
        defaultDatabase: ${CLICKHOUSE_DATABASE}
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: latest
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
