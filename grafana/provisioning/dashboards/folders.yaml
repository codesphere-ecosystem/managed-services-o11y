apiVersion: 1

# One folder per managed service and one for workspaces, each with its own provider. Grafana's file
# provisioning can't nest folders, so the managed-service folders share a "Managed services · " prefix.
# The Postgres alert rules go into the Postgres folder too, see ../alerting/.
providers:
  - name: managed-services-postgres
    folder: Managed services · Postgres
    type: file
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/managed-services/postgres
  - name: workspaces
    folder: Workspaces
    type: file
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/workspaces
