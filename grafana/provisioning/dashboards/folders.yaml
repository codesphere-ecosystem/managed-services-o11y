apiVersion: 1

# File provisioning can't nest folders, hence the "Managed services · " prefix.
providers:
  - name: managed-services
    folder: Managed services
    type: file
    allowUiUpdates: false
    options:
      path: ${GF_PATHS_PROVISIONING}/dashboards/managed-services/all
  - name: managed-services-postgres
    folder: Managed services · Postgres
    type: file
    allowUiUpdates: false
    options:
      path: ${GF_PATHS_PROVISIONING}/dashboards/managed-services/postgres
  - name: workspaces
    folder: Workspaces
    type: file
    allowUiUpdates: false
    options:
      path: ${GF_PATHS_PROVISIONING}/dashboards/workspaces
  - name: infrastructure
    folder: Infrastructure
    type: file
    allowUiUpdates: false
    options:
      path: ${GF_PATHS_PROVISIONING}/dashboards/infrastructure
