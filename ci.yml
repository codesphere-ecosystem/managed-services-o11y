schemaVersion: v0.5
prepare:
  steps: []
test:
  steps: []
run:
  gateway:
    type: router
    plan: 8
    replicaCount: 1
    network:
      isLandscapeGateway: true
      paths:
        - path: /otlp
          stripPath: true
          service: otel-collector
          port: 4318
        - path: /
          stripPath: false
          service: grafana
          port: 3000
  otel-collector:
    healthEndpoint: http://127.0.0.1:13133/
    plan: 201
    replicas: 1
    network:
      ports:
        - 4317
        - 4318
    env:
      OTLP_TOKEN: ${{ vault.otlpToken }}
      CLICKHOUSE_HOST: ms-clickhouse-v0-${{ team.id }}-landscape-${{ workspace.id }}-clickhouse.rg-${{ team.id }}
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: app
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${{ vault.clickhousePassword }}
      CLICKHOUSE_TABLE_ENGINE: MergeTree
      TELEMETRY_TTL: 168h
      # The image has no shell, so a static build can't bake a config file
      # into it; the collector reads its config from this variable instead.
      OTEL_COLLECTOR_CONFIG: |
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
          bearertokenauth:
            token: ${env:OTLP_TOKEN}

        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
                auth:
                  authenticator: bearertokenauth
              http:
                endpoint: 0.0.0.0:4318
                auth:
                  authenticator: bearertokenauth

        processors:
          memory_limiter:
            check_interval: 1s
            limit_percentage: 80
            spike_limit_percentage: 25

        exporters:
          clickhouse:
            endpoint: tcp://${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}?dial_timeout=10s
            database: ${env:CLICKHOUSE_DATABASE}
            username: ${env:CLICKHOUSE_USER}
            password: ${env:CLICKHOUSE_PASSWORD}
            ttl: ${env:TELEMETRY_TTL}
            create_schema: true
            # MergeTree for 1 instance; ReplicatedMergeTree for 3, where `app` only accepts replicated tables.
            table_engine:
              name: ${env:CLICKHOUSE_TABLE_ENGINE}
            sending_queue:
              batch:
                min_size: 5000
                flush_timeout: 5s

        service:
          extensions: [health_check, bearertokenauth]
          pipelines:
            traces:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [clickhouse]
            logs:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [clickhouse]
            metrics:
              receivers: [otlp]
              processors: [memory_limiter]
              exporters: [clickhouse]
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command:
      - --config=env:OTEL_COLLECTOR_CONFIG
  grafana:
    healthEndpoint: http://127.0.0.1:3000/api/health
    plan: 301
    replicas: 1
    network:
      ports:
        - 3000
    env:
      GF_SERVER_ROOT_URL: https://${{ workspace.devDomain }}/
      GF_SECURITY_ADMIN_USER: admin
      GF_PATHS_PROVISIONING: /home/user/app/grafana/provisioning
      GF_SECURITY_ADMIN_PASSWORD: ${{ vault.grafanaAdminPassword }}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: ms-postgres-v1-${{ team.id }}-landscape-${{ workspace.id }}-grafana-db.ms-postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${{ vault.grafanaDbPassword }}
      GF_DATABASE_SSL_MODE: require
      CLICKHOUSE_HOST: ms-clickhouse-v0-${{ team.id }}-landscape-${{ workspace.id }}-clickhouse.rg-${{ team.id }}
      CLICKHOUSE_DATABASE: app
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${{ vault.clickhousePassword }}
    runAsUser: 472
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    # The workspace has the provisioning at this path, and a static build
    # bakes it there.
    build:
      copy:
        - grafana/provisioning:grafana/provisioning
    steps:
      - command: /run.sh
  clickhouse:
    provider:
      name: clickhouse
      schemaVersion: v0
    plan:
      id: 0
      parameters:
        storage: 10240
        cpu: 10
        memory: 2048
        instances: 1
    config: {}
    secrets:
      password: ${{ vault.clickhousePassword }}
    version: 1.0.0
  grafana-db:
    provider:
      name: postgres
      schemaVersion: v1
    plan:
      id: 0
      parameters:
        storage: 10240
        cpu: 5
        memory: 512
    config:
      version: "18.6"
      userName: grafana
      databaseName: grafana
    secrets:
      userPassword: ${{ vault.grafanaDbPassword }}
      superuserPassword: ${{ vault.grafanaDbSuperuserPassword }}
