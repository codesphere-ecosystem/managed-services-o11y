schemaVersion: v0.5
prepare:
  steps: []
test:
  steps: []
run:
  gateway:
    type: router
    plan: 8
    replicaCount: 1
    network:
      isLandscapeGateway: true
      paths:
        - path: /otlp
          stripPath: true
          service: otel-collector
          port: 4318
        - path: /
          stripPath: false
          service: grafana
          port: 3000
  otel-collector:
    healthEndpoint: http://127.0.0.1:13133/
    plan: 201
    replicas: 1
    network:
      ports:
        - 4317
        - 4318
    env:
      OTLP_TOKEN: ${{ vault.otlpToken }}
      CLICKHOUSE_HOST: ms-clickhouse-v0-${{ team.id }}-landscape-${{ workspace.id }}-clickhouse.rg-${{ team.id }}
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: app
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${{ vault.clickhousePassword }}
      CLICKHOUSE_TABLE_ENGINE: MergeTree
      TELEMETRY_TTL: 168h
    volumeMounts:
      - name: _workspace
        mountPath: /etc/otelcol-contrib/config.yaml
        workspacePath: otel/config.yaml
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command:
      - --config=/etc/otelcol-contrib/config.yaml
  grafana:
    healthEndpoint: http://127.0.0.1:3000/api/health
    plan: 201
    replicas: 1
    network:
      ports:
        - 3000
    env:
      GF_SERVER_ROOT_URL: https://${{ workspace.devDomain }}/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${{ vault.grafanaAdminPassword }}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.4
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: ms-postgres-v1-${{ team.id }}-landscape-${{ workspace.id }}-grafana-db.ms-postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${{ vault.grafanaDbPassword }}
      GF_DATABASE_SSL_MODE: require
      CLICKHOUSE_HOST: ms-clickhouse-v0-${{ team.id }}-landscape-${{ workspace.id }}-clickhouse.rg-${{ team.id }}
      CLICKHOUSE_DATABASE: app
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${{ vault.clickhousePassword }}
    runAsUser: 472
    volumeMounts:
      - name: _workspace
        mountPath: /etc/grafana/provisioning
        workspacePath: grafana/provisioning
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
  clickhouse:
    provider:
      name: clickhouse
      schemaVersion: v0
    plan:
      id: 0
      parameters:
        storage: 10240
        cpu: 10
        memory: 2048
        instances: 1
    config: {}
    secrets:
      password: ${{ vault.clickhousePassword }}
    version: 1.0.0
  grafana-db:
    provider:
      name: postgres
      schemaVersion: v1
    plan:
      id: 0
      parameters:
        storage: 10240
        cpu: 5
        memory: 512
    config:
      version: "17.6"
      userName: grafana
      databaseName: grafana
    secrets:
      userPassword: ${{ vault.grafanaDbPassword }}
      superuserPassword: ${{ vault.grafanaDbSuperuserPassword }}
