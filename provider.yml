name: o11y
schemaVersion: v1beta1
backend:
  landscape:
    staticBuildArtifact: ghcr.io/codesphere-ecosystem/managed-services-o11y
author: Codesphere
category: Other
description: Logs, metrics and traces of your workspaces and services in one
  place, per resource group. Based on OpenTelemetry, ClickHouse and Grafana.
displayName: Codesphere Observability Stack
iconUrl: /ide/assets/managed-services/o11y.svg
configSchema:
  type: object
  properties: {}
detailsSchema:
  type: object
  properties:
    hostname:
      type: string
      format: uri
  additionalProperties: false
secretsSchema:
  type: object
  properties:
    otlpToken:
      type: string
      format: password
      pattern: ^[a-f0-9]{64}$
      description: Bearer token senders put in the Authorization header of OTLP requests.
    clickhousePassword:
      type: string
      format: password
      pattern: ^[a-zA-Z0-9]{32}$
    grafanaAdminPassword:
      type: string
      format: password
    grafanaDbPassword:
      type: string
      format: password
      pattern: ^[a-zA-Z0-9]{32}$
    grafanaDbSuperuserPassword:
      type: string
      format: password
      pattern: ^[a-zA-Z0-9]{32}$
  required:
    - otlpToken
    - clickhousePassword
    - grafanaAdminPassword
    - grafanaDbPassword
    - grafanaDbSuperuserPassword
  additionalProperties: false
resourceParameters: {}
plans: []
versions:
  0.1.0:
    artifactTag: 0.1.0
    description: Initial preview
