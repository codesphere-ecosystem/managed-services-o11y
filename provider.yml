name: managed-services-o11y
schemaVersion: v0
backend:
  landscape:
    gitUrl: https://github.com/codesphere-cloud/managed-services-o11y
author: Team o11y
category: Other
description: A Codesphere landscape that ingests OpenTelemetry logs, traces and
  metrics, stores them in a managed ClickHouse, and shows them in Grafana.
displayName: Dirty o11y
iconUrl: https://emoji.slack-edge.com/T01DXUTF5GV/dirty-o11y/0fef1341aa0bc615.png
configSchema:
  type: object
  properties: {}
detailsSchema:
  type: object
  properties:
    hostname:
      type: string
      format: uri
      description: Grafana. Senders outside the cluster reach the collector at <hostname>/otlp (OTLP/HTTP), with the otlpToken as bearer token.
    # Filled in by the marketplace for each server and port of the landscape: service_url_<server>_<port>.
    service_url_otel-collector_4318:
      type: string
      readOnly: true
      title: OTel collector endpoint (OTLP/HTTP)
      description: In-cluster endpoint of the collector. Use it as the team's OTLP export endpoint (protocol HTTP, otlpToken as auth token), or from workspaces of the team with the otlpToken as bearer token.
    service_url_otel-collector_4317:
      type: string
      readOnly: true
      title: OTel collector endpoint (OTLP/gRPC)
      description: In-cluster endpoint of the collector for OTLP/gRPC. Needs the otlpToken as bearer token.
  additionalProperties: false
secretsSchema:
  type: object
  properties:
    otlpToken:
      type: string
      format: password
      pattern: ^[a-f0-9]{64}$
      description: Bearer token senders put in the Authorization header of OTLP requests.
    clickhousePassword:
      type: string
      format: password
      pattern: ^[a-zA-Z0-9]{32}$
    grafanaAdminPassword:
      type: string
      format: password
    grafanaDbPassword:
      type: string
      format: password
      pattern: ^[a-zA-Z0-9]{32}$
    grafanaDbSuperuserPassword:
      type: string
      format: password
      pattern: ^[a-zA-Z0-9]{32}$
  required:
    - otlpToken
    - clickhousePassword
    - grafanaAdminPassword
    - grafanaDbPassword
    - grafanaDbSuperuserPassword
  additionalProperties: false
resourceParameters: {}
plans: []
versions:
  0.0.1:
    ciProfile: __cs_default__
    gitRef: main
    appVersion: unstable
    description: ""
