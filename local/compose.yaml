# Local stand-in for the landscape: same collector config and Grafana provisioning,
# a plain ClickHouse instead of the managed one, Grafana on SQLite.
name: obs-landscape

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_DATABASE: app
  CLICKHOUSE_USER: admin
  CLICKHOUSE_PASSWORD: local-password-1

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DB: app
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: local-password-1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "admin", "--password", "local-password-1", "-q", "SELECT 1"]
      interval: 2s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_TABLE_ENGINE: MergeTree
      TELEMETRY_TTL: 168h
      OTLP_TOKEN: local-token
    volumes:
      - ../otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on:
      clickhouse: {condition: service_healthy}

  grafana:
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    environment:
      <<: *clickhouse-env
      GF_SECURITY_ADMIN_PASSWORD: local-admin
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.4
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on:
      clickhouse: {condition: service_healthy}
